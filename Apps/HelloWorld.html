<!doctype html>
<html lang="en">
  <head>
    <!-- Use correct character set. -->
    <meta charset="utf-8" />
    <!-- Tell IE to use the latest, best version. -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Make the application on mobile take up the full browser screen and disable user scaling. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Hello World!</title>
    <script src="../Build/CesiumUnminified/Cesium.js"></script>
    <script src="./navigation/knockout.js"></script>
    <script>
      // Navigation plugin expects knockout to be attached to Cesium object in older versions
      if (!Cesium.knockout) {
        Cesium.knockout = window.knockout;
      }
    </script>
    <script src="./navigation/CesiumNavigation.umd.js"></script>
    <style>
      @import url(../Build/CesiumUnminified/Widgets/widgets.css);
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <script>
      const viewer = new Cesium.Viewer("cesiumContainer");

      // Initialize navigation plugin with options
      // Buradan istediğiniz özelliği açıp (true) kapatabilirsiniz (false).
      viewer.cesiumNavigation = new CesiumNavigation(viewer, {
        enableCompass: true,
        enableZoomControls: true,
        enableDistanceLegend: true
      });
    </script>
  </body>
</html>
